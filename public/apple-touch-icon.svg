<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D48B38" />
      <stop offset="40%" stop-color="#C85A32" />
      <stop offset="100%" stop-color="#8E3618" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#68B087" />
      <stop offset="100%" stop-color="#2C4A3E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#terracottaGrad)" filter="url(#shadow)" stroke="#FDFBF7" stroke-width="2"/>

  <!-- Subtle Inner Ring -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="#FAF6EF" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Artisan Spice Leaf Accent on top right -->
  <path d="M86 28 C96 22, 106 28, 104 42 C100 44, 88 42, 86 28 Z" fill="url(#leafGrad)" stroke="#FDFBF7" stroke-width="1"/>
  <path d="M86 36 Q96 32 104 42" fill="none" stroke="#FAF6EF" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Devanagari Monogram "उ" for Uttam Rasoi -->
  <text x="64" y="88" font-family="'Playfair Display', 'Cinzel', 'Noto Serif Devanagari', 'Georgia', serif" font-size="70" font-weight="900" fill="#FDFBF7" text-anchor="middle">उ</text>

  <!-- Golden Purity Dot -->
  <circle cx="94" cy="74" r="5" fill="#FAF6EF"/>
</svg>
